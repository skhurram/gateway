---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - gateway.gateway.local
  resources:
  - routes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.gateway.local
  resources:
  - routes/status
  verbs:
  - get
  - patch
  - update
