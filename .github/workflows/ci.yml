name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: controller/go.mod
      - run: make test
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          working-directory: controller

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint deploy/helm/gateway --kube-version 1.31.0
      - name: Render with default values
        run: helm template gateway deploy/helm/gateway --kube-version 1.31.0 > /dev/null
      - name: Render with the kind demo values
        run: helm template gateway deploy/helm/gateway --kube-version 1.31.0 -f deploy/kind/gateway-values.yaml > /dev/null

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize gateway module
        working-directory: terraform/modules/gateway
        run: terraform init -backend=false
      - name: Validate gateway module
        working-directory: terraform/modules/gateway
        run: terraform validate
      - name: Test gateway module
        working-directory: terraform/modules/gateway
        run: terraform test
      - name: Initialize local environment
        working-directory: terraform/environments/local
        run: terraform init -backend=false
      - name: Validate local environment
        working-directory: terraform/environments/local
        run: terraform validate
      - name: Initialize Exoscale cluster module
        working-directory: terraform/modules/exoscale-cluster
        run: terraform init -backend=false
      - name: Validate Exoscale cluster module
        working-directory: terraform/modules/exoscale-cluster
        run: terraform validate
      - name: Test Exoscale cluster module
        working-directory: terraform/modules/exoscale-cluster
        run: terraform test
      - name: Initialize demo environment
        working-directory: terraform/environments/demo
        run: terraform init -backend=false
      - name: Validate demo environment
        working-directory: terraform/environments/demo
        run: terraform validate
      - name: Lint Terraform
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - run: tflint --chdir terraform/modules/gateway
      - run: tflint --chdir terraform/modules/exoscale-cluster
      - run: tflint --chdir terraform/environments/local
      - run: tflint --chdir terraform/environments/demo

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build gateway image
        run: docker build -t edge-gateway:ci .
      - name: Build echo image
        run: docker build --build-arg CMD=echo -t edge-gateway-echo:ci .
      - name: Build controller image
        run: docker build -t edge-gateway-controller:ci controller
