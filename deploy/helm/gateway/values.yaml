# Default values for the gateway chart.

image:
  repository: edge-gateway
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Ignored when autoscaling.enabled is true, because the HPA owns the count.
replicaCount: 2

# Gateway configuration, rendered verbatim into a ConfigMap. The port in
# `listen` also sets the container and Service target port.
config:
  listen: ":8080"
  health:
    path: /health
    interval: 5s
    timeout: 2s
  routes:
    # Placeholder. Point this at real services, for example:
    #   - prefix: /api/users
    #     upstreams: [http://users.default.svc:8080]
    #     rate_limit: {requests_per_second: 50, burst: 100}
    - prefix: /
      upstreams:
        - http://upstream.default.svc:8080

service:
  type: ClusterIP
  port: 8080
  # Only used when type is NodePort.
  nodePort: null

# OpenTelemetry export. Leave endpoint empty to disable tracing and metrics.
otel:
  endpoint: ""
  # How often metrics are exported, in milliseconds (OTEL_METRIC_EXPORT_INTERVAL
  # takes an integer, not a duration like "10s").
  metricExportIntervalMs: 10000

# Rolling updates never remove a ready pod before its replacement is ready.
strategy:
  maxSurge: 1
  maxUnavailable: 0

# On deletion the pod first sits in preStop so the endpoint removal can reach
# kube-proxy and load balancers, then receives SIGTERM and drains in-flight
# requests (the gateway waits up to 30s). The grace period must cover both,
# plus a margin: 5 + 30 + 10.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 45

probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
