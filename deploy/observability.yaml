# Trace and metric backends for the local demo: an OpenTelemetry Collector that
# receives OTLP from the gateway and echo services, forwards traces to Jaeger,
# and exposes metrics in Prometheus format on :8889.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        # Series from pods that went away disappear after 30s instead of the
        # default 5m. Live pods refresh theirs every export interval (10s).
        metric_expiration: 30s
        resource_to_telemetry_conversion:
          enabled: true
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {app.kubernetes.io/name: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: MEMORY_MAX_TRACES, value: "5000"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /, port: 16686}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: {app.kubernetes.io/name: jaeger}
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
