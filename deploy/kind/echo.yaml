# Two demo upstreams for the gateway. Each is the cmd/echo binary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-users
  labels: {app.kubernetes.io/name: echo-users, app.kubernetes.io/part-of: edge-gateway-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: echo-users}
  template:
    metadata:
      labels: {app.kubernetes.io/name: echo-users, app.kubernetes.io/part-of: edge-gateway-demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: edge-gateway-echo:dev
          imagePullPolicy: Never
          env:
            - {name: ECHO_NAME, value: users}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(POD_NAME)"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-users
  labels: {app.kubernetes.io/name: echo-users, app.kubernetes.io/part-of: edge-gateway-demo}
spec:
  selector: {app.kubernetes.io/name: echo-users}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
